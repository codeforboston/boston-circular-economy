<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" />
<text x="60" y="46" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  —  CIRCULAR ECONOMY</text>
<text x="60" y="88" font-family="Montserrat, Arial, sans-serif" font-size="33" font-weight="bold" fill="#091F2F" text-anchor="start">Wiring: the drop-off locator</text>
<text x="60" y="122" font-family="Lora, Georgia, serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Travel chips pick one mode. One function per mode filters the sites. The page links the list and the map.</text>
<line x1="60" y1="140" x2="1540" y2="140" stroke="#C8C8C8" stroke-width="2" />
<text x="60" y="210" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="start">Travel mode — one chip at a time</text>
<rect x="60" y="230" width="150" height="54" rx="27" fill="#1871BD" />
<text x="135" y="264" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Walking</text>
<rect x="225" y="230" width="150" height="54" rx="27" fill="#FFFFFF" stroke="#091F2F" stroke-width="2" />
<text x="300" y="264" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="middle">Transit</text>
<rect x="390" y="230" width="130" height="54" rx="27" fill="#FFFFFF" stroke="#091F2F" stroke-width="2" />
<text x="455" y="264" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="middle">Car</text>
<line x1="520" y1="257" x2="580" y2="257" stroke="#091F2F" stroke-width="3" />
<polygon points="580,257 566,250 566,264" fill="#091F2F" />
<rect x="580" y="190" width="330" height="170" rx="4" fill="#0B1524" />
<text x="598" y="224" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DCE6F4" text-anchor="start">Strategy filter</text>
<text x="598" y="252" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">byTravelMode(mode)</text>
<text x="598" y="274" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">One function per mode</text>
<text x="598" y="296" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Smaller list out</text>
<line x1="910" y1="257" x2="970" y2="257" stroke="#091F2F" stroke-width="3" />
<polygon points="970,257 956,250 956,264" fill="#091F2F" />
<rect x="970" y="190" width="570" height="170" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2" />
<rect x="970" y="190" width="570" height="44" rx="0" fill="#091F2F" />
<text x="986" y="219" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">Page mediates</text>
<text x="986" y="262" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">selectedId: string | null</text>
<text x="986" y="284" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">One owner of the choice</text>
<rect x="60" y="420" width="700" height="230" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2" />
<rect x="60" y="420" width="700" height="44" rx="0" fill="#091F2F" />
<text x="76" y="449" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">SearchMap — reused</text>
<text x="76" y="492" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">One marker per site.</text>
<text x="76" y="514" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Markers are buttons.</text>
<text x="76" y="536" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Centre [42.36, -71.06].</text>
<text x="820" y="448" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="start">List — same sites, same order</text>
<rect x="820" y="470" width="720" height="44" rx="6" fill="#0E7C7B" />
<text x="836" y="499" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">Site A — 0.4 mi on foot</text>
<rect x="820" y="522" width="720" height="44" rx="6" fill="#0E7C7B" />
<text x="836" y="551" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">Site B — 0.8 mi on foot</text>
<rect x="820" y="574" width="720" height="44" rx="6" fill="#0E7C7B" />
<text x="836" y="603" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">Site C — list only, no map spot</text>
<line x1="760" y1="520" x2="820" y2="520" stroke="#091F2F" stroke-width="3" />
<polygon points="820,520 806,513 806,527" fill="#091F2F" />
<line x1="820" y1="560" x2="760" y2="560" stroke="#091F2F" stroke-width="3" />
<polygon points="760,560 774,553 774,567" fill="#091F2F" />
<text x="800" y="700" font-family="Lora, Georgia, serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="middle">A selection on one side updates both sides. The page passes selectedId down to both.</text>
<polygon points="350,728 470,780 350,832 230,780" fill="#FFD98A" stroke="#091F2F" stroke-width="2" />
<text x="350" y="776" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold" fill="#091F2F" text-anchor="middle">Site has</text>
<text x="350" y="795" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold" fill="#091F2F" text-anchor="middle">coordinates?</text>
<line x1="470" y1="780" x2="540" y2="780" stroke="#091F2F" stroke-width="3" />
<polygon points="540,780 526,773 526,787" fill="#091F2F" />
<text x="560" y="772" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0E7C7B" text-anchor="start">Yes — plot the marker</text>
<text x="560" y="806" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#D22D23" text-anchor="start">No — list only, never a false spot</text>
<rect x="40" y="850" width="1520" height="104" rx="0" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1" />
<text x="60" y="878" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold" fill="#091F2F" text-anchor="start" letter-spacing="1">LEGEND  —  THE SAME SHAPES IN EVERY PICTURE</text>
<rect x="60" y="894" width="40" height="24" rx="6" fill="#1871BD" />
<text x="110" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Card</text>
<rect x="430" y="894" width="40" height="24" rx="12" fill="#FB4D42" />
<text x="480" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Primary button</text>
<rect x="800" y="894" width="40" height="5" rx="2" fill="#0E7C7B" />
<rect x="800" y="902" width="40" height="5" rx="2" fill="#0E7C7B" />
<rect x="800" y="910" width="40" height="5" rx="2" fill="#0E7C7B" />
<text x="850" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">List</text>
<rect x="1170" y="894" width="40" height="24" rx="2" fill="#6FA8F5" />
<line x1="1176" y1="902" x2="1204" y2="902" stroke="#FFFFFF" stroke-width="2" />
<line x1="1176" y1="910" x2="1198" y2="910" stroke="#FFFFFF" stroke-width="2" />
<text x="1220" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Form</text>
<polygon points="80,928 100,940 80,952 60,940" fill="#FFD98A" stroke="#091F2F" stroke-width="1" />
<text x="110" y="946" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Decision gate</text>
<rect x="430" y="928" width="40" height="24" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="1" />
<rect x="430" y="928" width="40" height="8" rx="0" fill="#091F2F" />
<text x="480" y="946" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Screen frame</text>
<rect x="800" y="928" width="40" height="24" rx="2" fill="#0B1524" />
<line x1="806" y1="936" x2="834" y2="936" stroke="#DCE6F4" stroke-width="2" />
<line x1="806" y1="944" x2="828" y2="944" stroke="#DCE6F4" stroke-width="2" />
<text x="850" y="946" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">State / service</text>
</svg>