<text x="640" y="312" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="middle">take it?</text>
<line x1="752" y1="295" x2="775" y2="295" stroke="#091F2F" stroke-width="3" />
<polygon points="775,295 761,288 761,302" fill="#091F2F" />
<rect x="775" y="190" width="215" height="210" rx="10" fill="#1871BD" />
<text x="793" y="224" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">3. Scheduler</text>
<text x="793" y="252" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Size, day, slot</text>
<text x="793" y="276" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Summary</text>
<text x="793" y="300" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">in words</text>
<line x1="990" y1="295" x2="1020" y2="295" stroke="#091F2F" stroke-width="3" />
<polygon points="1020,295 1006,288 1006,302" fill="#091F2F" />
<rect x="1020" y="190" width="215" height="210" rx="10" fill="#1871BD" />
<text x="1038" y="224" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">4. Locator</text>
<text x="1038" y="252" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Walking, transit</text>
<text x="1038" y="276" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">or car</text>
<text x="1038" y="300" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Map and list</text>
<text x="1038" y="324" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">in sync</text>
<line x1="1235" y1="295" x2="1265" y2="295" stroke="#091F2F" stroke-width="3" />
<polygon points="1265,295 1251,288 1251,302" fill="#091F2F" />
<rect x="1265" y="190" width="275" height="210" rx="4" fill="#0B1524" />
<text x="1283" y="224" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DCE6F4" text-anchor="start">Done</text>
<text x="1283" y="252" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Item leaves</text>
<text x="1283" y="274" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">the home</text>
<text x="640" y="452" font-family="Lora, Georgia, serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="middle">Yes, No, or Maybe, in words, with the reason.</text>
<rect x="60" y="490" width="1480" height="110" rx="4" fill="#0B1524" />
<text x="78" y="524" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DCE6F4" text-anchor="start">No-car access is the point</text>
<text x="78" y="552" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Six of nine residents move bulky items without a car.</text>
<text x="78" y="574" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Walking and transit filters sit on the locator, not after it.</text>
<rect x="60" y="630" width="1480" height="130" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2" />
<rect x="60" y="630" width="1480" height="44" rx="0" fill="#091F2F" />
<text x="76" y="659" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">Persona: Jason, move-out journey</text>
<text x="76" y="702" font-family="Lora, Georgia, serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Trigger: bulky items are hard to give away. Plan: donate items people want.</text>
<text x="76" y="724" font-family="Lora, Georgia, serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Worry: penalties for poor-condition items.</text>
