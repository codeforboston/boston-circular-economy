<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" />
<text x="60" y="46" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  —  CIRCULAR ECONOMY</text>
<text x="60" y="88" font-family="Montserrat, Arial, sans-serif" font-size="33" font-weight="bold" fill="#091F2F" text-anchor="start">Donate and pickup: the journey Jason takes</text>
<text x="60" y="122" font-family="Lora, Georgia, serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Jason moves out. He checks an item, books a pickup, and finds a drop-off site on foot or by transit.</text>
<line x1="60" y1="140" x2="1540" y2="140" stroke="#C8C8C8" stroke-width="2" />
<rect x="60" y="190" width="215" height="210" rx="10" fill="#1871BD" />
<text x="78" y="224" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">1. Jason moves out</text>
<text x="78" y="252" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Bulky items</text>
<text x="78" y="276" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">to give away</text>
<text x="78" y="300" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">No car</text>
<line x1="275" y1="295" x2="305" y2="295" stroke="#091F2F" stroke-width="3" />
<polygon points="305,295 291,288 291,302" fill="#091F2F" />
<rect x="305" y="190" width="215" height="210" rx="10" fill="#1871BD" />
<text x="323" y="224" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">2. Checker</text>
<text x="323" y="252" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Names an item</text>
<text x="323" y="276" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Answer in words</text>
<text x="323" y="300" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="start">Yes, No, Maybe</text>
<line x1="520" y1="295" x2="530" y2="295" stroke="#091F2F" stroke-width="3" />
<polygon points="530,295 516,288 516,302" fill="#091F2F" />
<polygon points="640,199 752,295 640,391 528,295" fill="#FFD98A" stroke="#091F2F" stroke-width="2" />
