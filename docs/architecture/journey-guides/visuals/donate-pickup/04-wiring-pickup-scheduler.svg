<text x="1018" y="582" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">No open slots that day.</text>
<text x="1018" y="604" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Pick another day.</text>
<text x="1018" y="626" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Never a blank area.</text>
