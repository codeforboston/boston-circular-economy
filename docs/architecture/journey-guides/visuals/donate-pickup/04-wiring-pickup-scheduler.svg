<text x="728" y="252" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">usePickupSlots(size, day)</text>
<text x="728" y="274" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Server returns</text>
<text x="728" y="296" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">the open slots</text>
