<text x="60" y="46" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  —  CIRCULAR ECONOMY</text>
<text x="60" y="88" font-family="Montserrat, Arial, sans-serif" font-size="33" font-weight="bold" fill="#091F2F" text-anchor="start">Wiring: the pickup scheduler</text>
<text x="60" y="122" font-family="Lora, Georgia, serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Size and day go in. The server returns the open slots. The summary reads the booking back in words.</text>
