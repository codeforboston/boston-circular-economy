<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" />
<text x="60" y="46" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  —  CIRCULAR ECONOMY</text>
<text x="60" y="88" font-family="Montserrat, Arial, sans-serif" font-size="33" font-weight="bold" fill="#091F2F" text-anchor="start">Wiring: the acceptance checker</text>
<text x="60" y="122" font-family="Lora, Georgia, serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">The form takes the item. The rules answer. The answer is derived, never stored.</text>
<line x1="60" y1="140" x2="1540" y2="140" stroke="#C8C8C8" stroke-width="2" />
<rect x="60" y="200" width="300" height="220" rx="4" fill="#6FA8F5" />
<text x="76" y="230" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="start">Item form</text>
<text x="76" y="258" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold" fill="#091F2F" text-anchor="start">What is your item?</text>
<rect x="76" y="266" width="268" height="30" rx="2" fill="#FFFFFF" />
<rect x="76" y="316" width="130" height="44" rx="22" fill="#FB4D42" />
<text x="141" y="345" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CHECK</text>
<line x1="360" y1="310" x2="420" y2="310" stroke="#091F2F" stroke-width="3" />
<polygon points="420,310 406,303 406,317" fill="#091F2F" />
<rect x="420" y="200" width="250" height="220" rx="4" fill="#0B1524" />
<text x="438" y="234" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DCE6F4" text-anchor="start">Form state</text>
<text x="438" y="262" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">item: the text</text>
<text x="438" y="284" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Jason typed</text>
<text x="438" y="306" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">One owner only</text>
<line x1="670" y1="310" x2="730" y2="310" stroke="#091F2F" stroke-width="3" />
<polygon points="730,310 716,303 716,317" fill="#091F2F" />
<polygon points="840,210 955,310 840,410 725,310" fill="#FFD98A" stroke="#091F2F" stroke-width="2" />
<text x="840" y="306" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="middle">Rule</text>
<text x="840" y="327" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="bold" fill="#091F2F" text-anchor="middle">answers?</text>
<line x1="955" y1="310" x2="1015" y2="310" stroke="#091F2F" stroke-width="3" />
<polygon points="1015,310 1001,303 1001,317" fill="#091F2F" />
<rect x="1015" y="200" width="525" height="64" rx="10" fill="#1871BD" />
<text x="1033" y="234" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">Yes — the reason</text>
<rect x="1015" y="276" width="525" height="64" rx="10" fill="#1871BD" />
<text x="1033" y="310" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">No — the reason</text>
<rect x="1015" y="352" width="525" height="64" rx="10" fill="#1871BD" />
<text x="1033" y="386" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">Maybe — the reason</text>
<text x="1250" y="452" font-family="Lora, Georgia, serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="middle">First rule that answers wins.</text>
<rect x="60" y="500" width="520" height="200" rx="4" fill="#0B1524" />
<text x="78" y="534" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DCE6F4" text-anchor="start">Answer: derived, never stored</text>
<text x="78" y="562" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">Computed from the rules.</text>
<text x="78" y="584" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">A maybe stays a maybe</text>
<text x="78" y="606" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">until a human answers.</text>
<rect x="640" y="500" width="420" height="200" rx="4" fill="#0B1524" />
<text x="658" y="534" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="bold" fill="#DCE6F4" text-anchor="start">Provider rules — props</text>
<text x="658" y="562" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">One function per provider.</text>
<text x="658" y="584" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">The page shows the answer.</text>
<text x="658" y="606" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">A rule change needs</text>
<text x="658" y="628" font-family="Lora, Georgia, serif" font-size="15" font-weight="normal" fill="#DCE6F4" text-anchor="start">no page change.</text>
<line x1="850" y1="500" x2="840" y2="420" stroke="#091F2F" stroke-width="3" />
<polygon points="840,420 833,434 847,434" fill="#091F2F" />
<rect x="1100" y="500" width="440" height="200" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2" />
<rect x="1100" y="500" width="440" height="44" rx="0" fill="#091F2F" />
<text x="1116" y="529" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="start">Live region</text>
<text x="1116" y="572" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Announces the answer</text>
<text x="1116" y="594" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">in words.</text>
<text x="1116" y="616" font-family="Lora, Georgia, serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Screen reader hears it.</text>
<text x="800" y="790" font-family="Lora, Georgia, serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="middle">Strategy: one function per provider rule. The checker picks the rules for that provider.</text>
<rect x="40" y="850" width="1520" height="104" rx="0" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1" />
<text x="60" y="878" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold" fill="#091F2F" text-anchor="start" letter-spacing="1">LEGEND  —  THE SAME SHAPES IN EVERY PICTURE</text>
<rect x="60" y="894" width="40" height="24" rx="6" fill="#1871BD" />
<text x="110" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Card</text>
<rect x="430" y="894" width="40" height="24" rx="12" fill="#FB4D42" />
<text x="480" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Primary button</text>
<rect x="800" y="894" width="40" height="5" rx="2" fill="#0E7C7B" />
<rect x="800" y="902" width="40" height="5" rx="2" fill="#0E7C7B" />
<rect x="800" y="910" width="40" height="5" rx="2" fill="#0E7C7B" />
<text x="850" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">List</text>
<rect x="1170" y="894" width="40" height="24" rx="2" fill="#6FA8F5" />
<line x1="1176" y1="902" x2="1204" y2="902" stroke="#FFFFFF" stroke-width="2" />
<line x1="1176" y1="910" x2="1198" y2="910" stroke="#FFFFFF" stroke-width="2" />
<text x="1220" y="912" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Form</text>
<polygon points="80,928 100,940 80,952 60,940" fill="#FFD98A" stroke="#091F2F" stroke-width="1" />
<text x="110" y="946" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Decision gate</text>
<rect x="430" y="928" width="40" height="24" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="1" />
<rect x="430" y="928" width="40" height="8" rx="0" fill="#091F2F" />
<text x="480" y="946" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">Screen frame</text>
<rect x="800" y="928" width="40" height="24" rx="2" fill="#0B1524" />
<line x1="806" y1="936" x2="834" y2="936" stroke="#DCE6F4" stroke-width="2" />
<line x1="806" y1="944" x2="828" y2="944" stroke="#DCE6F4" stroke-width="2" />
<text x="850" y="946" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="normal" fill="#58585B" text-anchor="start">State / service</text>
