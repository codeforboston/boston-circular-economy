<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1871BD"/><text x="48" y="52" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  |  CIRCULAR ECONOMY</text><text x="48" y="100" font-family="Noto Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#091F2F" text-anchor="start">Decide journey map</text><text x="48" y="138" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="normal" fill="#58585B" text-anchor="start">Landing, then three wizard steps, then one routing rule sends the resident on.</text><line x1="48" y1="158" x2="1552" y2="158" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><rect x="48" y="210" width="240" height="260" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="48" y="210" width="240" height="46" rx="0" fill="#091F2F"/><text x="64" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Landing  /</text><text x="64" y="294" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="start">Type the item</text><text x="64" y="332" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Pick a card</text><text x="64" y="362" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Press NEXT</text><line x1="290" y1="340" x2="306" y2="340" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="306,340 292.3,348.2 292.3,331.8" fill="#091F2F"/><rect x="308" y="210" width="240" height="260" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="308" y="210" width="240" height="46" rx="0" fill="#091F2F"/><text x="324" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Step 1</text><text x="324" y="294" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="start">Condition</text><text x="324" y="332" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Broken zip</text><text x="324" y="362" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Hole or tear</text><line x1="550" y1="340" x2="566" y2="340" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="566,340 552.3,348.2 552.3,331.8" fill="#091F2F"/><rect x="568" y="210" width="240" height="260" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="568" y="210" width="240" height="46" rx="0" fill="#091F2F"/><text x="584" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Step 2</text><text x="584" y="294" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="start">Intent</text><text x="584" y="332" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">One question</text><text x="584" y="362" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">One answer</text><line x1="810" y1="340" x2="826" y2="340" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="826,340 812.3,348.2 812.3,331.8" fill="#091F2F"/><rect x="828" y="210" width="240" height="260" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="828" y="210" width="240" height="46" rx="0" fill="#091F2F"/><text x="844" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Step 3</text><text x="844" y="294" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="start">Location</text><text x="844" y="332" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Where are you?</text><text x="844" y="362" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#58585B" text-anchor="start">Type the place</text><line x1="1086" y1="340" x2="1114" y2="340" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1114,340 1100.3,348.2 1100.3,331.8" fill="#091F2F"/><polygon points="1224,220 1334,340 1224,460 1114,340" fill="#FFD98A" stroke="#091F2F" stroke-width="3"/><text x="1224" y="333.0" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="middle">Route by</text><text x="1224" y="361.0" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="middle">answers</text><rect x="1352" y="210" width="200" height="52" rx="10" fill="#1871BD"/><text x="1452" y="243" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Repair</text><line x1="1334" y1="340" x2="1346" y2="236" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1346,236 1352.6,250.6 1336.2,248.7" fill="#091F2F"/><rect x="1352" y="278" width="200" height="52" rx="10" fill="#1871BD"/><text x="1452" y="311" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Reuse</text><line x1="1334" y1="340" x2="1346" y2="304" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1346,304 1349.5,319.6 1333.8,314.4" fill="#091F2F"/><rect x="1352" y="346" width="200" height="52" rx="10" fill="#1871BD"/><text x="1452" y="379" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Recycle</text><line x1="1334" y1="340" x2="1346" y2="372" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1346,372 1333.5,362.1 1348.9,356.3" fill="#091F2F"/><rect x="1352" y="414" width="200" height="52" rx="10" fill="#1871BD"/><text x="1452" y="447" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Maintain</text><line x1="1334" y1="340" x2="1346" y2="440" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1346,440 1336.2,427.4 1352.6,425.4" fill="#091F2F"/><text x="48" y="540" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#091F2F" text-anchor="start">What each shape means on this map</text><rect x="48" y="564" width="300" height="64" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="48" y="564" width="300" height="22" rx="0" fill="#091F2F"/><text x="48" y="668" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">Each screen is one frame.</text><text x="48" y="696" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">Read it top to bottom.</text><polygon points="510,564 600,596 510,628 420,596" fill="#FFD98A" stroke="#091F2F" stroke-width="3"/><text x="510" y="602.0" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#091F2F" text-anchor="middle">One rule</text><text x="420" y="668" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">The diamond is the rule.</text><text x="420" y="696" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">It reads the answers.</text><rect x="680" y="564" width="300" height="64" rx="6" fill="#6FA8F5"/><rect x="696" y="582" width="268" height="10" rx="5" fill="#FFFFFF"/><rect x="696" y="608" width="166" height="10" rx="5" fill="#FFFFFF"/><text x="680" y="668" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">Each step asks one question.</text><text x="680" y="696" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">One group, one answer.</text><rect x="1060" y="564" width="300" height="64" rx="32" fill="#FB4D42"/><text x="1210" y="603" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEXT</text><text x="1060" y="668" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">NEXT is the primary action.</text><text x="1060" y="696" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#58585B" text-anchor="start">It moves the resident on.</text><line x1="48" y1="760" x2="1552" y2="760" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><text x="48" y="800" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#091F2F" text-anchor="start">Legend</text><rect x="48" y="824" width="32" height="18" rx="4" fill="#1871BD"/><text x="87" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Card</text><rect x="262" y="824" width="32" height="18" rx="9" fill="#FB4D42"/><text x="302" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Button</text><rect x="477" y="824" width="32" height="3" rx="0" fill="#0E7C7B"/><rect x="477" y="830" width="32" height="3" rx="0" fill="#0E7C7B"/><rect x="477" y="837" width="32" height="3" rx="0" fill="#0E7C7B"/><text x="517" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">List</text><rect x="692" y="824" width="32" height="18" rx="0" fill="#6FA8F5"/><rect x="696" y="831" width="24" height="3" rx="0" fill="#FFFFFF"/><rect x="696" y="837" width="14" height="3" rx="0" fill="#FFFFFF"/><text x="732" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Form</text><polygon points="923,820 939,833 923,846 907,833" fill="#FFD98A" stroke="#091F2F" stroke-width="1.5"/><text x="947" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Decision gate</text><rect x="1122" y="824" width="32" height="18" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="1.5"/><rect x="1122" y="824" width="32" height="6" rx="0" fill="#091F2F"/><text x="1161" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Screen frame</text><rect x="1337" y="824" width="32" height="18" rx="0" fill="#DCE6F4" stroke="#0B1524" stroke-width="2"/><text x="1376" y="839" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">State and services</text><text x="48" y="950" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#828282" text-anchor="start">Decide journey: landing, wizard, routing result.</text></svg>