<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1871BD"/><text x="48" y="52" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  |  CIRCULAR ECONOMY</text><text x="48" y="100" font-family="Noto Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#091F2F" text-anchor="start">Build map: Decide, screen by screen</text><text x="48" y="138" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="normal" fill="#58585B" text-anchor="start">One real journey, built in order. Each step ends with a check.</text><line x1="48" y1="158" x2="1552" y2="158" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><rect x="48" y="210" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="48" y="210" width="330" height="46" rx="0" fill="#091F2F"/><text x="64" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 1  |  Set up</text><text x="64" y="302" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">Tools, first file,</text><text x="64" y="336" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">first style</text><text x="64" y="390" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">Check before you move on.</text><line x1="380" y1="320" x2="416" y2="320" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="416,320 402.3,328.2 402.3,311.8" fill="#091F2F"/><rect x="418" y="210" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="418" y="210" width="330" height="46" rx="0" fill="#091F2F"/><text x="434" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 2  |  Shared shell</text><text x="434" y="302" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">Skip link, main,</text><text x="434" y="336" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">live region</text><text x="434" y="390" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">Check before you move on.</text><line x1="750" y1="320" x2="786" y2="320" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="786,320 772.3,328.2 772.3,311.8" fill="#091F2F"/><rect x="788" y="210" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="788" y="210" width="330" height="46" rx="0" fill="#091F2F"/><text x="804" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 3  |  Landing</text><text x="804" y="302" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">Hero, search, cards,</text><text x="804" y="336" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">FAQ, NEXT</text><text x="804" y="390" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">Check before you move on.</text><line x1="1120" y1="320" x2="1156" y2="320" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1156,320 1142.3,328.2 1142.3,311.8" fill="#091F2F"/><rect x="1158" y="210" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="1158" y="210" width="330" height="46" rx="0" fill="#091F2F"/><text x="1174" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 4  |  Wizard</text><text x="1174" y="302" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">Three steps,</text><text x="1174" y="336" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">BACK and NEXT</text><text x="1174" y="390" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">Check before you move on.</text><line x1="1323" y1="432" x2="1323" y2="488" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="1323,488 1314.8,474.3 1331.2,474.3" fill="#091F2F"/><rect x="788" y="490" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="788" y="490" width="330" height="46" rx="0" fill="#091F2F"/><text x="804" y="520" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 5  |  Routing result</text><text x="804" y="582" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">One function,</text><text x="804" y="616" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">four routes</text><text x="804" y="670" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">The route word updates.</text><line x1="786" y1="600" x2="750" y2="600" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="750,600 763.7,591.8 763.7,608.2" fill="#091F2F"/><rect x="418" y="490" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="418" y="490" width="330" height="46" rx="0" fill="#091F2F"/><text x="434" y="520" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 6  |  Final check</text><text x="434" y="582" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">Keyboard, screen reader,</text><text x="434" y="616" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">zoom, phone width</text><text x="434" y="670" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">Every walk passes.</text><line x1="416" y1="600" x2="380" y2="600" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="380,600 393.7,591.8 393.7,608.2" fill="#091F2F"/><rect x="48" y="490" width="330" height="220" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="48" y="490" width="330" height="46" rx="0" fill="#091F2F"/><text x="64" y="520" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">Stage 7  |  Working journey</text><text x="64" y="582" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">Landing to route,</text><text x="64" y="616" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">end to end</text><text x="64" y="670" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1871BD" text-anchor="start">The journey works.</text><line x1="48" y1="780" x2="1552" y2="780" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><text x="48" y="820" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#091F2F" text-anchor="start">Legend</text><rect x="48" y="844" width="32" height="18" rx="4" fill="#1871BD"/><text x="87" y="859" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="norma