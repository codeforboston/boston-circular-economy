  —  derived</text><text x="1088" y="800" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">routeByAnswers(answers)</text><text x="48" y="890" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">The next step is a function of the answers so far. The route is derived, never stored.</text><line x1="48" y1="920" x2="1552" y2="920" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><text x="48" y="960" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#091F2F" text-anchor="start">Legend</text><rect x="48" y="984" width="30" height="17" rx="4" fill="#1871BD"/><text x="85" y="998" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Card</text><rect x="262" y="984" width="30" height="17" rx="8" fill="#FB4D42"/><text x="300" y="998" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Button</text><rect x="477" y="984" width="30" height="3" rx="0" fill="#0E7C7B"/><rect x="477" y="990" width="30" height="3" rx="0" fill="#0E7C7B"/><rect x="477" y="996" width="30" height="3" rx="0" fill="#0E7C7B"/><text x="515" y="998" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">List</text><rect x="692" y="984" width="30" height="17" rx="0" fill="#6FA8F5"/><rect x="696" y="991" width="22" height="3" rx="0" fill="#FFFFFF"/><rect x="696" y="997" width="13" height="3" rx="0" fill="#FFFFFF"/><text x="729" y="998" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#58585B" text-anchor="start">Form</text><polygon points="922,980 937,992 922,1004 907,992" fill="#FFD98A" stroke="#091F2F" stroke-width="1.5"/><text x="944" y="998" font-family="Noto Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#58