ial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">item: text the resident types</text><text x="976" y="309" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">FAQ open: one section at a time</text><text x="976" y="338" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">service type: picked card</text><rect x="960" y="480" width="592" height="250" rx="6" fill="#DCE6F4" stroke="#0B1524" stroke-width="3"/><rect x="960" y="480" width="592" height="40" rx="6" fill="#0B1524"/><rect x="960" y="508" width="592" height="12" rx="0" fill="#0B1524"/><text x="976" y="507" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">STATE  —  URL and services</text><text x="976" y="550" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">URL owns the item after NEXT:</text><text x="976" y="579" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">  /decide?item=&lt;item&gt;</text><text x="976" y="608" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">Service client: no call on this screen</text><text x="976" y="637" font-family="Noto Sans, Arial, sans-serif" font-size="19" font-weight="normal" fill="#0B1524" text-anchor="start">Query client: nothing cached here</text><line x1="910" y1="420" x2="956" y2="330" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="956,330 957.1,346.0 942.4,338.5" fill="#091F2F"/><line x1="910" y1="660" x2="956" y2="610" stroke="#091F2F" stroke-width="3" stroke-linecap="round"/><polygon points="956,610 952.8,625.7 940.6,614.5" fill="#091F2F"/><text x="48" y="860" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#58585B" text-anchor="start">NEXT moves the item from component state to the URL. The next page reads it from the link.</text><line x1="48" y1="900" x2="1552" y2="900" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><text x="48" y="940" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#091F2F" text-anchor="start">Legend</text><rect x="48" y="964" width="32" height="18" rx="4" fill="#1871BD"/><text x="87" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Card</text><rect x="262" y="964" width="32" height="18" rx="9" fill="#FB4D42"/><text x="302" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Button</text><rect x="477" y="964" width="32" height="3" rx="0" fill="#0E7C7B"/><rect x="477" y="970" width="32" height="3" rx="0" fill="#0E7C7B"/><rect x="477" y="977" width="32" height="3" rx="0" fill="#0E7C7B"/><text x="517" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">List</text><rect x="692" y="964" width="32" height="18" rx="0" fill="#6FA8F5"/><rect x="696" y="971" width="24" height="3" rx="0" fill="#FFFFFF"/><rect x="696" y="977" width="14" height="3" rx="0" fill="#FFFFFF"/><text x="732" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Form</text><polygon points="923,960 939,973 923,986 907,973" fill="#FFD98A" stroke="#091F2F" stroke-width="1.5"/><text x="947" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Decision gate</text><rect x="1122" y="964" width="32" height="18" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="1.5"/><rect x="1122" y="964" width="32" height="6" rx="0" fill="#091F2F"/><text x="1161" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">Screen frame</text><rect x="1337" y="964" width="32" height="18" rx="0" fill="#DCE6F4" stroke="#0B1524" stroke-width="2"/><text x="1376" y="979" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="normal" fill="#58585B" text-anchor="start">State and services</text><text x="48" y="1010" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="normal" fill="#828282" text-anchor="start">Landing wiring: presentational parts, component state, URL state.</text></svg>