<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect x="0" y="0" width="1600" height="1040" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1871BD"/><text x="48" y="52" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1871BD" text-anchor="start" letter-spacing="2">CODE FOR BOSTON  |  CIRCULAR ECONOMY</text><text x="48" y="100" font-family="Noto Sans, Arial, sans-serif" font-size="40" font-weight="bold" fill="#091F2F" text-anchor="start">Wiring: the landing page</text><text x="48" y="138" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="normal" fill="#58585B" text-anchor="start">Components, state, and services on the landing page.</text><line x1="48" y1="158" x2="1552" y2="158" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/><rect x="48" y="210" width="860" height="600" rx="0" fill="#EDF2F9" stroke="#091F2F" stroke-width="2"/><rect x="48" y="210" width="860" height="46" rx="0" fill="#091F2F"/><text x="64" y="240" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">Landing  /</text><rect x="72" y="276" width="812" height="74" rx="6" fill="#091F2F"/><text x="90" y="324" font-family="Noto Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">HERO  .hro</text><rect x="72" y="370" width="812" height="96" rx="6" fill="#6FA8F5"/><text x="88" y="400" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#091F2F" text-anchor="start">What is your item?</text><rect x="88" y="414" width="780" height="10" rx="5" fill="#FFFFFF"/><rect x="88" y="440" width="483" height="10" rx="5" fill="#FFFFFF"/><rect x="72" y="486" width="185" height="64" rx="10" fill="#1871BD"/><text x="164" y="524" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Repair</text><rect x="277"