[project]
name = "etl"
version = "0.1.0"
description = "ETL pipeline for collecting and normalizing circular economy location data"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.3",
]

[project.scripts]
scrape-to-local = "etl.jobs.scrape_to_local:main"
merge-process-to-local = "etl.jobs.merge_process_to_local:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
# Pydantic DTOs intentionally use the widely supported string-enum form.
ignore = ["UP042"]

[tool.ruff.format]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
