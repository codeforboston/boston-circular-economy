[project]
name = "etl"
version = "0.1.0"
description = "ETL pipeline for collecting and normalizing circular economy location data"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "boston-circular-economy-contracts",
    "boston-circular-economy-data-store",
    "pydantic>=2.13.3",
    "phonenumbers>=9.0.37",
    "rapidfuzz>=3.14.5",
    "cleanco>=2.3",
    "usaddress-scourgify>=0.7.1",
]

[project.scripts]
scrape-to-local = "etl.jobs.scrape_to_local:main"
merge-process-to-local = "etl.jobs.merge_process_to_local:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["network: hits a live external API"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
boston-circular-economy-contracts = { path = "../packages/contracts", editable = true }
boston-circular-economy-data-store = { path = "../packages/data-store", editable = true }
