name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-to-github-pages
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve the successful CI run for current main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          run_id="$(
            gh api -X GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$current_sha" \
              -f per_page=1 \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [[ -z "$run_id" ]]; then
            echo "::notice::Current main has no successful push CI artifact yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$current_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: reconcile
    if: needs.reconcile.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download tested client artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: github-pages-client
          path: client/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.reconcile.outputs.run_id }}
      - name: Verify tested client artifact
        run: test -f client/dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./client/dist
      - name: Confirm tested commit is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.reconcile.outputs.sha }}
        run: |
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [[ "$TESTED_SHA" != "$current_sha" ]]; then
            echo "::error::A newer main commit superseded this tested artifact."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Detect main advancing during deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.reconcile.outputs.sha }}
        run: |
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [[ "$TESTED_SHA" != "$current_sha" ]]; then
            echo "::error::Main advanced while Pages was publishing this artifact."
            echo "The successful CI for current main will trigger a forward deployment."
            exit 1
          fi
