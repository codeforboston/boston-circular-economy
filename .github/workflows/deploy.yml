name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      'deploy-to-github-pages' ||
      format('deploy-ignored-{0}', github.event.workflow_run.id)
    }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_sha: ${{ steps.source.outputs.artifact_sha }}
      main_sha: ${{ steps.source.outputs.main_sha }}
      ready: ${{ steps.source.outputs.ready }}
      run_id: ${{ steps.source.outputs.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve the latest tested client artifact for current main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          successful_runs="$(
            gh api --paginate -X GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f per_page=100 \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv'
          )"
          run_id=""
          artifact_sha=""
          current_ci_succeeded="false"
          while IFS=$'\t' read -r candidate_run_id candidate_sha; do
            if [[ "$candidate_sha" == "$current_sha" ]]; then
              current_ci_succeeded="true"
              break
            fi
          done <<< "$successful_runs"
          if [[ "$current_ci_succeeded" != "true" ]]; then
            echo "::notice::Current main does not have successful push CI yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS=$'\t' read -r candidate_run_id candidate_sha; do
            if [[ -z "$candidate_run_id" || -z "$candidate_sha" ]]; then
              continue
            fi
            artifact_id="$(
              gh api -X GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts" \
                -f per_page=100 \
                --jq '.artifacts[] | select(
                  .name == "github-pages-client" and .expired == false
                ) | .id' \
                | head -n 1
            )"
            if [[ -z "$artifact_id" ]]; then
              continue
            fi
            relation="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/compare/$candidate_sha...$current_sha" \
                --jq .status
            )"
            if [[ "$relation" == "identical" || "$relation" == "ahead" ]]; then
              run_id="$candidate_run_id"
              artifact_sha="$candidate_sha"
              break
            fi
          done <<< "$successful_runs"
          if [[ -z "$run_id" ]]; then
            echo "::notice::Current main has no reachable, unexpired client artifact."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$current_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: reconcile
    if: needs.reconcile.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download tested client artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: github-pages-client
          path: client/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.reconcile.outputs.run_id }}
      - name: Verify tested client artifact
        run: test -f client/dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./client/dist
      - name: Confirm reconciled main is still current
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILED_MAIN_SHA: ${{ needs.reconcile.outputs.main_sha }}
        run: |
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [[ "$RECONCILED_MAIN_SHA" != "$current_sha" ]]; then
            echo "::error::A newer main commit superseded this tested artifact."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Detect main advancing during deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILED_MAIN_SHA: ${{ needs.reconcile.outputs.main_sha }}
        run: |
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          )"
          if [[ "$RECONCILED_MAIN_SHA" != "$current_sha" ]]; then
            echo "::error::Main advanced while Pages was publishing this artifact."
            echo "The successful CI for current main will trigger a forward deployment."
            exit 1
          fi
