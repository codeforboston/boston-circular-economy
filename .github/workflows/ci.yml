name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Route changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.route.outputs.frontend }}
      server: ${{ steps.route.outputs.server }}
      etl: ${{ steps.route.outputs.etl }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.3'
      - name: Test routing policy
        run: >-
          python -B -m unittest discover
          -s .agents/skills/route-agent-work/scripts
          -p 'test_*.py' -v
      - name: Select application checks
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python -B .agents/skills/route-agent-work/scripts/route_work.py \
              classify --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python -B .agents/skills/route-agent-work/scripts/route_work.py \
              classify --all --github-output "$GITHUB_OUTPUT"
          fi

  prose:
    name: Prose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.3'
      - name: Check technical prose and editorial style
        run: >-
          python -B
          .agents/skills/make-evidence-based-technical-case/scripts/check_prose.py
          .
      - name: Test prose checker
        run: >-
          python -B -m unittest discover
          -s .agents/skills/make-evidence-based-technical-case/scripts
          -p 'test_*.py' -v
      - name: Check pull request submission record
        if: github.event_name == 'pull_request'
        run: >-
          python -B
          .agents/skills/make-evidence-based-technical-case/scripts/check_submission.py
          --event "$GITHUB_EVENT_PATH"

  frontend:
    name: Frontend
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stop when routing failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint client
        run: npm run lint -w client
      - name: Build client
        run: npm run build -w client
      - name: Save tested client artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages-client
          path: client/dist
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.server == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stop when routing failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint server
        run: npm run lint -w server
      - name: Build server
        run: npm run build -w server

  etl:
    name: ETL
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.etl == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Stop when routing failed
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: etl/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint and check formatting
        run: uv run ruff check . && uv run ruff format --check .
      - name: Run tests
        run: uv run pytest
