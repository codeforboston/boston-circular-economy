name: Pre-Merge Checks

on:
  # Trigger the workflow on pull requests to the main branch, by default types are opened, reopened, and synchronize
  pull_request:
    branches:
      - main
jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Run tests
        run: uv run pytest
  
  check-openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Export OpenAPI schema
        working-directory: server
        run: uv run python scripts/export_openapi.py

      - name: Check openapi.json is up to date
        run: |
          git diff --exit-code -- client/src/api/openapi.json || {
            echo "::error::client/src/api/openapi.json is out of date. Run 'npm run gen:api' in client/ and commit the updated openapi.json."
            exit 1
          }